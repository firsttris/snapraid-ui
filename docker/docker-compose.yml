services:
  snapraid-ui:
    image: tristanteu/snapraid-ui:latest
    # To build from source instead: docker compose -f docker/docker-compose.yml up --build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: snapraid-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      # App data: config.json, snapraid.conf, schedules, logs
      - ./snapraid:/app/snapraid
      # Data, content and parity disks, mounted at the same paths as on the host
      # so the paths in snapraid.conf stay valid. Content and parity must be writable.
      # - /mnt/disk1:/mnt/disk1
      # - /mnt/disk2:/mnt/disk2
      # - /mnt/parity:/mnt/parity
      # Optional: use the host's snapraid binary instead of the bundled one
      # - /usr/bin/snapraid:/usr/bin/snapraid:ro
    # environment:
    #   - SNAPRAID_BIN=/usr/bin/snapraid
    privileged: true  # Needed for SMART data and disk info
