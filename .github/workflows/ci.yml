name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # The release workflow runs the same checks before it publishes anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - run: deno check src/main.ts src/bin.ts
      - run: deno test --allow-all

  frontend:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx biome check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # SnapRAID, snapraid-daemon and the UI for real, driven through the browser (docs/development.md).
  # local: the backend's sources with the built frontend; image: the Docker image from docker/Dockerfile;
  # binary: the standalone binary from scripts/build-binary.sh.
  # Each target in two shards: every shard starts its own servers and runs half of the test files
  e2e:
    if: ${{ !github.event.pull_request.draft }}
    name: e2e (${{ matrix.target }}, ${{ matrix.shard }}/2)
    # Playwright 1.56 installs no browser on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the image's build cache, shared with the release
    strategy:
      fail-fast: false
      matrix:
        target: [local, image, binary]
        shard: [1, 2]
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_IMAGE: ${{ matrix.target == 'image' && 'snapraid-ui:e2e' || '' }}
      E2E_BINARY: ${{ matrix.target == 'binary' && '../dist/snapraid-ui-linux-x86_64' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Cache SnapRAID and snapraid-daemon builds
        uses: actions/cache@v4
        with:
          path: e2e/.tools
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('e2e/scripts/setup-tools.sh', 'backend/src/engine/REVIEWED_DAEMON_VERSION') }}
      # smartmontools: SnapRAID lists the disks on the SMART page with it, self-tests use a stand-in
      - uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: autoconf automake zlib1g-dev smartmontools
          recommends: "false"
      - name: Build SnapRAID and snapraid-daemon
        run: npm run setup
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Install the frontend, the tests or the binary build it
        if: matrix.target != 'image'
        working-directory: frontend
        run: npm ci
      # The tests run the x86_64 one; arm64 is built too, so the release does not find a problem first
      - name: Build the binaries
        if: matrix.target == 'binary'
        working-directory: .
        run: scripts/build-binary.sh x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      # With the release's build cache: only the layers that changed are built again
      - name: Build the Docker image
        if: matrix.target == 'image'
        uses: firsttris/workflows/actions/docker-build@ccr-161f105b-9ns022
        with:
          dockerfile: docker/Dockerfile
          tags: ${{ env.E2E_IMAGE }}
      - run: npm test -- --shard=${{ matrix.shard }}/2
      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/*.log
          retention-days: 7
          include-hidden-files: true
