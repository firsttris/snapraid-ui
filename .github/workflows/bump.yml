name: Bump version

# Raises the version in frontend/package.json, commits it, tags the commit vX.Y.Z and starts release.yml on it.
# Same scheme as in every project, see https://github.com/firsttris/workflows#bump-version
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  bump:
    uses: firsttris/workflows/.github/workflows/bump-version.yml@v1
    with:
      bump: ${{ inputs.bump }}
      version-file: frontend/package.json
    permissions:
      contents: write
      actions: write
