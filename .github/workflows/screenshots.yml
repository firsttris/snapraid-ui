name: Update screenshots

# Takes the pictures in the README and the documentation from the demo sandbox
# (e2e/screenshots/readme.spec.ts, docs/development.md) and commits the ones that changed.
# Run it after a change to the look. docs/screenshots/daemon.png is still taken by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  screenshots:
    needs: image
    runs-on: ubuntu-latest
    # The browser and its fonts of the @playwright/test version the e2e tests pin
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # scripts/dev/setup.sh builds SnapRAID for the sandbox
      - name: Build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl
      - name: Cache the SnapRAID build
        uses: actions/cache@v6
        with:
          path: |
            scripts/dev/bin
            scripts/dev/.cache
          key: demo-snapraid-${{ hashFiles('scripts/dev/setup.sh') }}
      # The npm package brings Bun without curl or unzip; the version is packageManager in
      # package.json, as setup-bun takes it in the other workflows
      - name: Install
        run: |
          npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          bun install --frozen-lockfile
      - name: Take the screenshots
        working-directory: e2e
        # The container runs as root: the disks go to /mnt, as on a server
        env:
          DISKS_DIR: /mnt
        run: bun run screenshots
      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: |
            docs/screenshot.png
            docs/screenshot-dark.png
            docs/screenshots
            docs/social-preview.png
