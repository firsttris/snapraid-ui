name: Publish Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: tristanteu/snapraid-ui

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare README for Docker Hub
        run: |
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/master
          BLOB=https://github.com/${{ github.repository }}/blob/master
          sed -E \
            -e "s#\]\((\./|/)?docs/#](${RAW}/docs/#g" \
            -e "s#src=\"(\./|/)?docs/#src=\"${RAW}/docs/#g" \
            -e "s#\]\((\./|/)?docker/#](${BLOB}/docker/#g" \
            README.md > dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ env.IMAGE }}
          short-description: Web UI for SnapRAID — run sync/scrub, schedule jobs, monitor disks and SMART health
          readme-filepath: ./dockerhub-readme.md
