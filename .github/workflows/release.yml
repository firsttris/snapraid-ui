name: Release

# Pushing a tag vX.Y.Z publishes that version: the CI first (skipped when master's CI already tested
# the code, see https://github.com/firsttris/workflows#tested-on-main), then the shared Docker release from
# firsttris/workflows, which pushes the image as :x.y.z, :x.y and :latest, updates the Docker Hub
# description and creates the GitHub release; the standalone binaries are attached to it after.
# The tag must match the version in frontend/package.json.
# Run by hand on master: the same checks, then the image as :edge, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # the e2e image build keeps its cache

  docker:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/snapraid-ui
      description: Web UI for SnapRAID — run sync/scrub, schedule jobs, monitor disks and SMART health
      version-file: frontend/package.json
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # The standalone binaries (scripts/build-binary.sh) and the installer, attached to the release the
  # Docker job created: snapraid-ui-linux-x86_64, snapraid-ui-linux-aarch64, SHA256SUMS and install.sh,
  # which users fetch from releases/latest/download/install.sh
  binaries:
    needs: docker
    if: ${{ !cancelled() && needs.docker.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: scripts/build-binary.sh x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Checksums
        working-directory: dist
        run: sha256sum snapraid-ui-linux-* > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh dist/install.sh
          # The Docker release creates it; should it not, the binaries still get one
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/snapraid-ui-linux-* dist/SHA256SUMS dist/install.sh --clobber
