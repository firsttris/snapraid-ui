name: SnapRAID Release Check

# The image pins a SnapRAID release (SNAPRAID_VERSION in docker/Dockerfile).
# This opens an issue when a newer stable release is out, so it gets tested and bumped on purpose.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare pinned and latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG SNAPRAID_VERSION=//p' docker/Dockerfile)
          # releases/latest skips pre-releases such as release candidates
          latest=$(gh api repos/amadvance/snapraid/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "Pinned: $pinned, latest: $latest"
          if [ "$pinned" = "$latest" ]; then
            exit 0
          fi

          title="SnapRAID $latest is available (pinned: $pinned)"
          if gh issue list --state open --search "in:title \"SnapRAID $latest is available\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue already open"
            exit 0
          fi

          gh issue create --title "$title" --body "$(cat <<BODY
          SnapRAID [$latest](https://github.com/amadvance/snapraid/releases/tag/v$latest) is out, the image ships $pinned.

          Before bumping \`SNAPRAID_VERSION\` in \`docker/Dockerfile\` and \`dev/setup.sh\`:

          - [ ] Read the [HISTORY](https://github.com/amadvance/snapraid/blob/v$latest/HISTORY) for changes to the structured log (\`--log\`)
          - [ ] \`SNAPRAID_VERSION=$latest dev/setup.sh --reset\`, then run status, diff, sync, scrub, check, list, dup, touch and smart in the UI
          - [ ] A major version: compare the log tags with the parser fixtures in \`backend/src/parsers/__tests__/fixtures\`
          BODY
          )"
